data_type: sar


general:
  origin: auto             # auto = use input data center; manual = use lon0/lat0 below
  lon0:                    # required only when origin: manual
  lat0:                    # required only when origin: manual


sar_config:
  outName: S1_T128A
  reader: gamma         # gamma | gamma_tiff | hyp3
  mode: unwrapped_phase             # unwrapped_phase | los_displacement | range_offset | azimuth_offset
  directory: ..
  output_check: true
  output_suffix: auto          # auto appends _RngOff/_AziOff for range/azimuth offsets

  files:
    prefix: geo_20220105_20220117
    phsname:
    rscname:
    azifile:
    incfile:

  read:
    downsample: 1              # used for quick-look and downsample runs
    downsample_for_covar: 1    # used only when estimating covariance
    zero2nan: true
    wavelength:                # phase_los uses reader metadata or this value
    factor_to_m: 1.0 # TIFF displacement unit scale; keep 1.0 for phase radians
    phase_band: 1
    azi_band: 1
    inc_band: 1
    is_lonlat:
    overrides: {}
  qc:
    outlier_threshold: 12.0
    summary_percentile: 99.0
    plot:
      save_fig: true
      file_path: sar_values.png
      show: true
      rawdownsample4plot: 1
      value_space: observation    # observation = converted CSI value; raw = product value
      factor4plot: 100.0          # meter to centimeter for display
      vmin: -40
      vmax: 40
      symmetry: true
      cmap: cmc.roma_r
      colorbar_orientation: vertical
      colorbar_mode: auto
      colorbar_loc:
      colorbar_size:
      colorbar_thickness:
      colorbar_pad:
      cb_label:


covar:
  do_covar: false          # can also be enabled with ecat-downsample -c
  mask_out: [100.5, 101.75, 37.35, 38.1]  # required for covariance estimation; mask deformation source area
  missing_policy: existing_or_identity   # when downsampling without covariance: existing_or_identity | identity | error
  function: exp            # exp | gauss covariance model
  frac: 0.002              # fraction of pixels sampled for empirical covariance
  every: 2.0               # distance-bin spacing for empirical covariance
  distmax: 100.0           # maximum distance used for covariance fitting
  rampEst: true            # estimate/remove a planar ramp before covariance

downsample:
  enabled: false           # can also be enabled with ecat-downsample -d
  method: std            # std is fault-free and easiest for first tests; trirb needs fault geometry
  # Used only when method: std.
  std_config:
    startingsize: 20.0       # initial square block size in CSI projected units, usually km
    minimumsize: 0.25       # smallest allowed block size
    tolerance: 0.05         # minimum valid-pixel fraction to keep a block
    std_threshold: 0.02    # split blocks until within-block std is below this value
    smooth:                 # optional smoothing length for block std; null disables it
    use_variance: false     # false = compare std; true = compare variance with std_threshold
    amplitude_stat: mean_abs   # mean_abs | abs_mean | median_abs; used by high/low amplitude controls
    focus_region:
      enabled: false        # true limits refinement outside the polygon below
      coord_type: lonlat    # lonlat | xy; polygon is converted to CSI xy when lonlat
      polygon:              # inline [[lon, lat], ...]; use this or polygon_file, not both
      polygon_file:         # text file with two columns: lon lat or x y; relative to config file
      max_splits_outside: 5 # maximum std split level outside focus polygon
    high_value_refinement:
      enabled: false        # true forces extra splits where block amplitude is large
      high_value_ratio: 0.25 # amplitude threshold as fraction of reference max value
      min_splits: 1         # minimum split level for high-value blocks
      reference_max_value:      # null = use max(abs(input value))
    low_amplitude_cap:
      enabled: false        # true caps splitting in low-amplitude, likely noisy areas
      amplitude_ratio: 0.05 # low amplitude threshold as fraction of reference max value
      max_splits: 3         # maximum split level for low-amplitude blocks
      reference_max_value:      # null = share CSI reference max value
      apply_inside_focus_region: false # false keeps focus polygon free to refine
    plot: false             # pass plotting flag to CSI during downsampling iterations
    decimorig: 10           # plot decimation used only when plot: true
    itmax: 100              # maximum std-based splitting iterations
    verboseLevel: minimum




  plot_decim:
    style: cells           # cells = draw CSI output cells; points = draw sample centers
    coordrange:            # [minlon, maxlon, minlat, maxlat]; null = all decimated data
    figsize: [3.0, 5.0]   # final decimated-data check figure size
    dpi: 600
    factor4plot:           # null = inherit raw quick-look display scale
    vmin:                  # null = auto; CLI --vmin/--vmax override SAR decim plots
    vmax:
    symmetry: true
    cmap: cmc.roma_r
    edgewidth: 0.1
    edgecolor: black
    alpha: 1.0
    markersize: 10         # used only when style: points
    colorbar_orientation: vertical
    colorbar_mode: auto
    colorbar_loc:
    colorbar_size:
    colorbar_thickness:
    colorbar_pad:
    cb_label:

faults:
  - enabled: false
    trace_file: ../../../../Faults/example_rupture_trace.dat
    dip_angle: 86          # degrees from horizontal
    dip_direction: 258     # degrees clockwise from north
    top_size: 5.0          # top mesh target size, usually km
    bottom_size: 8.0       # bottom mesh target size, usually km
    top_depth: 0.0         # km
    bottom_depth: 18.0     # km
